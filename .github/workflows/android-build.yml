name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # 2dust/AndroidLibXrayLite'tan derlenecek sürüm etiketi. Daha yenisi çıktıysa
  # https://github.com/2dust/AndroidLibXrayLite/releases adresinden güncelle.
  XRAY_LITE_TAG: v26.8.20
  NDK_VERSION: "26.1.10909125"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOT: android-actions/setup-android@v3 KASITLI OLARAK KULLANILMIYOR.
      # O eylem, Google'ın SDK deposundan artık kaldırılmış "tools" paketini
      # kurmaya çalışıyor ve "Failed to find package 'tools'" hatasıyla patlıyor.
      # GitHub'ın ubuntu-latest imajında Android SDK zaten kurulu geliyor
      # (ANDROID_HOME / ANDROID_SDK_ROOT ortam değişkenleri hazır) — biz sadece
      # projenin ihtiyaç duyduğu platform ve build-tools paketlerini, SDK'nın
      # kendi cmdline-tools'uyla ekliyoruz.
      - name: Android SDK bileşenlerini kur (compileSdk 36)
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadı, ANDROID_HOME: $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 3
            exit 1
          fi
          echo "Kullanılan sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Go kur
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # ÖNEMLİ: com.github.2dust:AndroidLibXrayLite bir Maven/JitPack paketi DEĞİLDİR —
      # bu bir Go kaynak kodu deposudur (README'sinde "Go + gomobile kur, gomobile bind
      # çalıştır" yazar). Önceki sürümde bunu Maven bağımlılığı sanıp yanlış yapmıştık;
      # "Could not find com.github.2dust:AndroidLibXrayLite" hatası bu yüzdendi.
      # Gerçek çözüm: libv2ray.aar'ı burada, gomobile ile kaynağından GERÇEKTEN derlemek.
      - name: libv2ray.aar derle (Xray-core, gomobile ile kaynağından)
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

          git clone --depth 1 --branch "${XRAY_LITE_TAG}" \
            https://github.com/2dust/AndroidLibXrayLite.git /tmp/androidlibxraylite
          cd /tmp/androidlibxraylite
          go mod tidy

          gomobile bind -androidapi 24 -ldflags="-s -w" -o libv2ray.aar ./

          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libv2ray.aar "$GITHUB_WORKSPACE/app/libs/libv2ray.aar"
          echo "libv2ray.aar boyutu:"
          ls -lh "$GITHUB_WORKSPACE/app/libs/libv2ray.aar"

      # Yerel Android Studio derlemesi için: Go/gomobile kurmak istemeyenler bu
      # artifact'i indirip app/libs/libv2ray.aar olarak kendi kopyalarına koyabilir.
      - name: libv2ray.aar'ı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-aar
          path: app/libs/libv2ray.aar
          if-no-files-found: error

      - name: Gradle kur (sistem Gradle — wrapper repo'da yok)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gradle wrapper üret
        run: gradle wrapper --gradle-version 8.9

      - name: Lint + derleme kontrolü
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Debug APK oluştur
        run: ./gradlew assembleDebug --stacktrace

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ihvpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK oluştur (sadece v* etiketinde)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace

      - name: Release APK'yı artifact olarak yükle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ihvpn-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
